              // ==========================================
              // توابع کمکی
              // ==========================================
              private String detectPhoneFromText(String raw) {
                  if (raw == null || raw.isEmpty()) return "unknown";
                  try {
                      Matcher m = Pattern.compile("(?:\\+98|0098|98|0)?(9\\d{9})\\b").matcher(raw);
                      if (m.find()) {
                          return "0" + m.group(1);
                      }
                  } catch (Exception ignored) {
                  }
                  return "unknown";
              }

